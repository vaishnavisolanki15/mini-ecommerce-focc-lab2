apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: focc-ecommerce
  labels:
    app: mini-ecommerce
    component: backend
data:
  PORT: "5000"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # Controlled CPU load testing is enabled for lab autoscaling evaluation
  ENABLE_TEST_LOAD: "true"
