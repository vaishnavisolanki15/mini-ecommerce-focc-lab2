# ==============================================================================
# HorizontalPodAutoscaler (HPA) for Backend Service
# Fundamentals of Cloud Computing Lab 2
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: focc-ecommerce
  labels:
    app: mini-ecommerce
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
    # Uses standard Kubernetes resource metrics (NOT custom application metrics)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300  # 5-minute cooldown to prevent flapping
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
